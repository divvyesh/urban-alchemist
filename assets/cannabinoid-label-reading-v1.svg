<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
<title id="title">Three numbers, three different meanings</title><desc id="desc">THCA measures the acidic form, delta-9 THC measures the neutral form, and total THC estimates potential after conversion. This is an educational example, not a lab report.</desc>
<rect width="960" height="720" fill="#ede4d1"/><rect x="28" y="28" width="904" height="664" rx="4" fill="#fffdf7" stroke="#b7883a"/>
<g fill="#173d2b" font-family="Georgia,serif"><text x="66" y="111" font-size="40">Three fields. Three meanings.</text></g>
<text x="66" y="150" fill="#525a4e" font-family="Arial,sans-serif" font-size="18">ILLUSTRATIVE ONLY · NOT A LAB REPORT</text>
<g fill="#f6f1e4"><rect x="65" y="187" width="830" height="110"/><rect x="65" y="309" width="830" height="110"/><rect x="65" y="431" width="830" height="110"/></g>
<g font-family="Georgia,serif" font-size="31" fill="#173d2b"><text x="90" y="239">THCA</text><text x="90" y="361">Δ9-THC</text><text x="90" y="483">Total THC</text></g>
<g font-family="Arial,sans-serif" font-size="23" fill="#2c352c"><text x="340" y="230">The acidic form measured</text><text x="340" y="262">in the sample</text><text x="340" y="352">The neutral form measured</text><text x="340" y="384">in the sample</text><text x="340" y="474">Calculated potential after</text><text x="340" y="506">THCA converts to THC</text></g>
<path d="M65 567H895" stroke="#b7883a"/><g font-family="Arial,sans-serif" fill="#525a4e" font-size="20"><text x="66" y="608">Check the batch, units, method and test date.</text><text x="66" y="642">Potential content does not predict personal impairment.</text></g></svg>
